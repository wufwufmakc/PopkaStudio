# Keeps this fork up to date with PopaSpinka/PopkaStudio: once a day (or by hand, Actions -> Upstream sync -> Run)
# the original's main is merged into this main. A clean merge is first built and test-installed on Windows
# (windows-installer.yml); only then does it go into main, and the release's .exe is rebuilt. A merge with conflicts
# (both sides changed the same lines) goes nowhere: an issue "Upstream sync: conflicts" lists the files.
name: Upstream sync

on:
  schedule:
    - cron: "17 4 * * *"  # (every day, 04:17 UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync

env:
  UPSTREAM: https://github.com/PopaSpinka/PopkaStudio.git
  BRANCH: upstream-sync

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.m.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge the original's main
        id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Nothing new in the original."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git log --oneline HEAD..upstream/main
          if ! git merge --no-edit -m "Sync with PopaSpinka/PopkaStudio" upstream/main; then
            files=$(git diff --name-only --diff-filter=U)
            git merge --abort
            echo "changed=false" >> "$GITHUB_OUTPUT"
            title="Upstream sync: conflicts"
            body=$(printf 'The original (PopaSpinka/PopkaStudio) has new commits that conflict with this fork, in:\n\n%s\n\nmain was left as it is. Merge by hand: `git fetch %s main && git merge FETCH_HEAD`, fix these files, push. This issue closes itself after the next clean sync.\n\n%s' \
              "$(echo "$files" | sed 's/^/- `/; s/$/`/')" "$UPSTREAM" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
            if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            exit 0
          fi
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  test:
    needs: merge
    if: needs.merge.outputs.changed == 'true'
    uses: ./.github/workflows/windows-installer.yml
    with:
      ref: upstream-sync

  publish:
    needs: [merge, test]
    if: needs.merge.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Into main, then the release's .exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "$BRANCH"
          git merge --ff-only "origin/$BRANCH"  # (main moved meanwhile: stops here, the next run tries again)
          git push origin HEAD:main
          git push origin --delete "$BRANCH" || true
          # (a push by this workflow's token starts no workflow: the installer's run is asked for)
          gh workflow run windows-installer.yml --ref main
          n=$(gh issue list --state open --search 'in:title "Upstream sync: conflicts"' --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue close "$n" --comment "Synced cleanly: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
