# PopkaStudio-Setup-<version>.exe: built on Windows, installed there once as a test (without the ESP32 core, which is
# 1.5-3 GB: the editor starts and answers; Load needs the real board). A tag v* puts the .exe into that tag's release.
name: Windows installer

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # (the release on a tag)

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version (studio.py's VERSION)
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path studio/studio.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc /Qp "/DAppVersion=${{ steps.v.outputs.version }}" installer\PopkaStudio.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem installer\Output

      - name: Test - install it silently (no ESP32 core), into a folder with a space, as for a user named "AI LAB"
        shell: pwsh
        env:
          POPKASTUDIO_SKIP_CORE: "1"
        run: |
          $exe = (Get-ChildItem installer\Output\PopkaStudio-Setup-*.exe).FullName
          $app = Join-Path $env:RUNNER_TEMP 'AI LAB\PopkaStudio'
          $env:TEMP = $env:TMP = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'AI LAB\Temp')).FullName
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$app`"", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if (Test-Path "$app\install.log") { Get-Content "$app\install.log" }
          if ($p.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "setup exited $($p.ExitCode)" }
          foreach ($f in '.venv\Scripts\python.exe', '.tools\bin\arduino-cli.exe', 'tools\fonts\GoogleSansFlex.ttf', 'bin\popkastudio.cmd') {
            if (-not (Test-Path "$app\$f")) { throw "missing after install: $f" }
          }
          "APP=$app" >> $env:GITHUB_ENV

      - name: Test - the editor starts and answers
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $env:PATH = "$env:APP\.tools\bin;$env:PATH"
          $log = Join-Path $env:RUNNER_TEMP 'studio.log'
          $p = Start-Process "$env:APP\.venv\Scripts\python.exe" -ArgumentList "`"$env:APP\studio\studio.py`"" `
               -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            try {
              $about = Invoke-RestMethod http://127.0.0.1:8466/api/about
              $boards = Invoke-RestMethod http://127.0.0.1:8466/api/boards
              $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8466/
              $ok = $true; break
            } catch { Start-Sleep 1 }
          }
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'the editor did not answer on :8466' }
          "version: $($about.version)"
          & "$env:APP\.venv\Scripts\python.exe" -c "import sys; sys.argv = ['x']; sys.path.insert(0, r'$env:APP\studio'); import studio as s; print('no_spaces:', s.no_spaces(s.SKETCH)); print(s.own_partitions('amoled175g'))"
          $boards | ConvertTo-Json -Depth 3 -Compress | Select-Object -First 1
          if ($page.StatusCode -ne 200) { throw "the page: $($page.StatusCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: PopkaStudio-Setup-${{ steps.v.outputs.version }}
          path: installer/Output/*.exe

      - name: Into the release (a tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE) { gh release create $tag --title "PopkaStudio $tag" --notes "Windows: PopkaStudio-Setup.exe" }
          gh release upload $tag (Get-ChildItem installer\Output\*.exe).FullName --clobber
